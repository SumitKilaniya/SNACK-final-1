name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Typecheck + build
    runs-on: ubuntu-latest
    # Postgres service container matching docker-compose credentials — the app
    # is Postgres-only now, so generate/build/test run against a real Postgres.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: snackpod
          POSTGRES_PASSWORD: snackpod
          POSTGRES_DB: snackpod
        options: >-
          --health-cmd "pg_isready -U snackpod -d snackpod"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://snackpod:snackpod@localhost:5432/snackpod
      # Test-only values so the production server (boot smoke test below) can
      # start; the app's startup gate requires all four. Never real secrets.
      JWT_ACCESS_SECRET: ci-test-access-secret-0123456789abcdef
      JWT_RESET_SECRET: ci-test-reset-secret-0123456789abcdef
      APP_ORIGIN: http://localhost:3000
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Prisma client
        run: bunx prisma generate

      - name: Typecheck
        run: bun run type-check

      - name: Unit tests (pricing, coupons, order state machine)
        run: bun test

      - name: Dependency audit (non-blocking)
        run: bun audit --production || echo "::warning::bun audit found advisories — review and bump"

      - name: Production build
        run: bun run build

      - name: Smoke test — boot the built app and probe /api/health + /
        # Boots the production server in the background and waits until it is
        # genuinely serving. Catches boot-crashing bugs (bad startup env,
        # module-level crashes, DB wiring) in CI instead of as a 502 in a
        # preview or production. Postgres service container above is required
        # for /api/health to return 200.
        env:
          PORT: 3100
        run: |
          set -e
          bun run start &
          APP_PID=$!
          trap 'kill $APP_PID 2>/dev/null || true' EXIT
          READY=0
          for i in $(seq 1 30); do
            if curl -sf "http://localhost:3100/api/health" > /dev/null 2>&1; then
              READY=1
              break
            fi
            sleep 1
          done
          if [ "$READY" != "1" ]; then
            echo "::error::App did not become healthy within 30s — boot failure (check the build output above)"
            exit 1
          fi
          echo "health: $(curl -sf http://localhost:3100/api/health)"
          curl -sf -o /dev/null http://localhost:3100/
          echo "smoke test OK — /api/health and / both returned 200"
