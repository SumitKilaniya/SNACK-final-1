# Snack-Pod local development stack: app + Postgres + Redis.
#
# Postgres is the datasource everywhere (see prisma/schema.prisma); migrations
# live in prisma/migrations and are applied before the Compose app starts.
#
#   docker compose up --build
#   open http://localhost:3000   (health: http://localhost:3000/api/health)
#
# Copy .env.example to .env.local first. Local-only values must never be reused
# in production.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: snackpod
      POSTGRES_PASSWORD: snackpod
      POSTGRES_DB: snackpod
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U snackpod -d snackpod"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build:
      context: .
      target: development
    entrypoint: ["/bin/sh", "-c"]
    command: "pnpm run db:migrate:deploy && pnpm run dev"
    env_file:
      - .env.local
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    # Auto-restart if the app crashes after boot, so a dead container is never
    # left silently refusing connections; failures stay visible in
    # `docker compose logs -f`.
    restart: unless-stopped
    environment:
      NODE_ENV: development
      # Core / required
      DATABASE_URL: postgresql://snackpod:snackpod@db:5432/snackpod
      APP_ORIGIN: http://localhost:3000
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      # Google OAuth (blank until configured)
      NEXT_PUBLIC_GOOGLE_CLIENT_ID: ""
      GOOGLE_CLIENT_ID: ""
      GOOGLE_CLIENT_SECRET: ""
      # Stripe payments (blank until configured)
      STRIPE_SECRET_KEY: ""
      STRIPE_WEBHOOK_SECRET: ""
      STRIPE_CURRENCY: ""
      # Optional integration placeholders for local use
      RESEND_API_KEY: ""
      EMAIL_PROVIDER: ""
      RESEND_FROM: ""
      # SMS/OTP (local development uses the console provider)
      TWILIO_ACCOUNT_SID: ""
      TWILIO_AUTH_TOKEN: ""
      TWILIO_PHONE_NUMBER: ""
      TWILIO_FROM: ""
      SMS_PROVIDER: ""
      # Monitoring
      SENTRY_DSN: ""
      # Optional
      REDIS_URL: redis://redis:6379
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  pgdata:
